<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Draft War Room</title>

    <meta name="theme-color" content="#07101f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Draft War Room">

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-180.png">

    <link rel="stylesheet" href="styles.css?v=0.15.2">
    <link rel="stylesheet" href="layout.css?v=0.15.3">
    <link rel="stylesheet" href="quick-select.css?v=0.15.2">
</head>

<body>

    <header>
        <div>
            <h1>Draft War Room</h1>
            <div class="sub">
                High Roehler · 12-team ESPN Full PPR
            </div>
        </div>

        <div
            id="draftActivity"
            class="draft-activity"
            aria-live="polite">
        </div>

        <div class="header-actions">
            <button id="preDraftBtn">
                Pre-Draft
            </button>

            <button
                id="startLiveDraftBtn"
                class="start-live-draft-btn">
                Start Live Draft
            </button>

            <button id="commandmentsBtn">
                Commandments
            </button>

            <button id="resetBtn">
                New Mock
            </button>
        </div>
    </header>


    <main>
        <section
            id="war-room"
            class="page active">
        </section>

        <section
            id="tiers"
            class="page">
        </section>

        <section
            id="players"
            class="page">
        </section>

        <section
            id="draft-board"
            class="page">
        </section>

        <section
            id="playbook"
            class="page">
        </section>

        <section
            id="chat"
            class="page">
        </section>
    </main>


    <nav>
        <button
            data-page="war-room"
            class="active">
            Decision
        </button>

        <button data-page="tiers">
            Tiers
        </button>

        <button data-page="players">
            Players
        </button>

        <button data-page="draft-board">
            Draft Board
        </button>

        <button data-page="playbook">
            Playbook
        </button>

        <button data-page="chat">
            Chat
        </button>
    </nav>


    <div class="build-version">
        v0.18.6
    </div>


    <dialog id="commandmentsDialog">
        <div class="dialog-head">
            <h2>Draft Commandments</h2>

            <button onclick="this.closest('dialog').close()">
                Close
            </button>
        </div>

        <ol id="commandmentsList"></ol>
    </dialog>


    <dialog id="draftDialog">
        <div class="dialog-head">
            <h2 id="draftDialogTitle">
                Draft Player
            </h2>

            <button onclick="this.closest('dialog').close()">
                Close
            </button>
        </div>

        <div id="draftDialogBody"></div>
    </dialog>


    <dialog id="settingsDialog">
        <div class="dialog-head">
            <h2>
                Target Position Totals
            </h2>

            <button onclick="this.closest('dialog').close()">
                Close
            </button>
        </div>

        <div id="settingsBody"></div>
    </dialog>


    <dialog id="labelsDialog">
        <div class="dialog-head">
            <h2>
                Our Label Guide
            </h2>

            <button onclick="this.closest('dialog').close()">
                Close
            </button>
        </div>

        <div id="labelsGuide"></div>
    </dialog>


    <dialog id="preDraftDialog">
        <div class="dialog-head">
            <h2>
                Pre-Draft Setup
            </h2>

            <button onclick="this.closest('dialog').close()">
                Close
            </button>
        </div>

        <div id="preDraftBody">
            <div class="muted">
                Pre-Draft setup controls will go here.
            </div>
        </div>
    </dialog>


    <script>
        const dwrBuild = Date.now();

        document.write(`<script src="app.js?v=${dwrBuild}"><\/script>`);
        document.write(`<script src="layout.js?v=${dwrBuild}"><\/script>`);
        document.write(`<script src="turn-awareness.js?v=${dwrBuild}"><\/script>`);
        document.write(`<script src="players-sort.js?v=${dwrBuild}"><\/script>`);
        document.write(`<script src="draft-intelligence.js?v=${dwrBuild}"><\/script>`);
        document.write(`<script src="config.js?v=${dwrBuild}"><\/script>`);
        document.write(`<script src="ai-engine.js?v=${dwrBuild}"><\/script>`);
        document.write(`<script src="draft-simulator.js?v=${dwrBuild}"><\/script>`);
        document.write(`<script src="draft-recap.js?v=${dwrBuild}"><\/script>`);
        document.write(`<script src="toolbar-menu.js?v=${dwrBuild}"><\/script>`);
        document.write(`<script src="decision-tree.js?v=${dwrBuild}"><\/script>`);
        document.write(`<script src="pwa.js?v=${dwrBuild}"><\/script>`);
    </script>

</body>

</html>
