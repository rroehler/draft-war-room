<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Draft War Room</title>
<link rel="stylesheet" href="styles.css?v=0.10.1">
<link rel="stylesheet" href="layout.css?v=0.10.1">
<link rel="stylesheet" href="quick-select.css?v=0.10.1">
</head>
<body>
<header>
<div><h1>Draft War Room</h1><div class="sub">High Roehler · 12-team ESPN Full PPR</div></div>
<div id="draftActivity" class="draft-activity" aria-live="polite"></div>
<div class="header-actions">
<button id="keeperBtn">Keeper Mode</button>
<button id="commandmentsBtn">Commandments</button>
<button id="resetBtn" class="danger">Reset Draft</button>
</div>
</header>

<main>
<section id="war-room" class="page active"></section>
<section id="players" class="page"></section>
<section id="draft-board" class="page"></section>
<section id="playbook" class="page"></section>
<section id="chat" class="page"></section>
</main>

<nav>
<button data-page="war-room" class="active">War Room</button>
<button data-page="players">Players</button>
<button data-page="draft-board">Draft Board</button>
<button data-page="playbook">Playbook</button>
<button data-page="chat">Chat</button>
</nav>

<div class="build-version">v0.10.1</div>

<dialog id="commandmentsDialog"><div class="dialog-head"><h2>Draft Commandments</h2><button onclick="this.closest('dialog').close()">Close</button></div><ol id="commandmentsList"></ol></dialog>
<dialog id="draftDialog"><div class="dialog-head"><h2 id="draftDialogTitle">Draft Player</h2><button onclick="this.closest('dialog').close()">Close</button></div><div id="draftDialogBody"></div></dialog>
<dialog id="settingsDialog"><div class="dialog-head"><h2>Target Position Totals</h2><button onclick="this.closest('dialog').close()">Close</button></div><div id="settingsBody"></div></dialog>
<dialog id="labelsDialog"><div class="dialog-head"><h2>Our Label Guide</h2><button onclick="this.closest('dialog').close()">Close</button></div><div id="labelsGuide"></div></dialog>

<script src="app.js?v=0.10.1"></script>
<script src="layout.js?v=0.10.1"></script>
</body>
</html>
